name: Build Cheat Engine

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - uses: gcarreno/setup-lazarus@v3
      with:
        lazarus-version: 2.2.2

    - run: lazbuild --build-mode="Release" "Cheat Engine/cheatengine.lpi"

    - name: Copy TCC and Dependencies
      run: |
        xcopy /E /I "Cheat Engine\bin\tcc" "Cheat Engine\bin\tcc" || echo "TCC copy skipped"
        if exist "Cheat Engine\tcc" xcopy /E /I /Y "Cheat Engine\tcc" "Cheat Engine\bin\tcc\"

    - name: Upload Full Bin Folder
      uses: actions/upload-artifact@v4
      with:
        name: CheatEngine-Full
        path: Cheat Engine/bin/
